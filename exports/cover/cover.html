<!DOCTYPE html>
<!-- Cover banner from the NIX logo. Size comes from the window: ?w=1500&h=500 is only for preview;
     render.sh screenshots this file with Chrome headless at each size. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#07090f; --cyan:#00e5ff; --pink:#ff2d75; --purple:#7c4dff; --text:#b3bccf; --bright:#eef2f8; --dim:#6b7690; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg)}
  body{font-family:"Be Vietnam Pro",sans-serif;color:var(--text);position:relative;-webkit-font-smoothing:antialiased;
       --u:min(1vh*2.2, 1vw*0.75)}            /* one scale unit that fits both wide and tall banners */
  /* background: glows + grid + hex pattern */
  .glow{position:absolute;inset:0;background:
      radial-gradient(ellipse 45% 70% at 78% 50%, rgba(0,229,255,.20), transparent 70%),
      radial-gradient(ellipse 35% 60% at 95% 100%, rgba(124,77,255,.22), transparent 70%),
      radial-gradient(ellipse 30% 50% at 5% 0%, rgba(255,45,117,.12), transparent 70%)}
  .grid{position:absolute;inset:0;opacity:.35;
      background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
      background-size:calc(var(--u)*4) calc(var(--u)*4);
      mask-image:radial-gradient(ellipse 80% 90% at 70% 50%,#000 30%,transparent 80%)}
  .hexbg{position:absolute;right:-8vh;top:50%;height:150vh;transform:translateY(-50%);opacity:.05}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;gap:calc(var(--u)*3.2);padding:0 7vw 0 0}
  .logo{height:min(62vh,30vw);filter:drop-shadow(0 0 calc(var(--u)*1.6) rgba(0,229,255,.55))}
  .txt{display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
  .tag{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:calc(var(--u)*.95);letter-spacing:.35em;color:var(--cyan);text-transform:uppercase}
  .name{font-weight:900;font-size:calc(var(--u)*3.6);line-height:1;color:var(--bright);letter-spacing:.02em;white-space:nowrap}
  .name b{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--cyan)}
  .role{font-weight:700;font-size:calc(var(--u)*1.35);color:var(--bright);opacity:.9}
  .role i{font-style:normal;color:var(--pink);padding:0 .4em}
  /* taller frames (16:9, 4:3): stack logo over text, centered */
  @media (max-aspect-ratio: 2/1){
    body{--u:min(1vh*1.9, 1vw*1.25)}
    .wrap{flex-direction:column;justify-content:center;padding:0;gap:calc(var(--u)*2.4)}
    .logo{height:34vh}
    .txt{align-items:center;text-align:center}
    .hexbg{right:50%;transform:translate(50%,-50%);height:130vh;opacity:.035}
    .glow{background:
      radial-gradient(ellipse 50% 45% at 50% 32%, rgba(0,229,255,.18), transparent 70%),
      radial-gradient(ellipse 40% 50% at 100% 100%, rgba(124,77,255,.22), transparent 70%),
      radial-gradient(ellipse 35% 45% at 0% 0%, rgba(255,45,117,.12), transparent 70%)}
    .grid{mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 80%)}
  }
  .line{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--pink) 30%,var(--purple) 60%,var(--cyan))}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <img class="hexbg" src="../../assets/logo/NIX-02.svg" alt="" />
  <div class="wrap">
    <img class="logo" src="../../assets/logo/NIX-02.svg" alt="NIX" />
    <div class="txt">
      <div class="tag">Unity · Mobile Games</div>
      <div class="name">TRAN VAN TIEN <b>[NIX]</b></div>
      <div class="role">Unity Developer<i>|</i>AI Coding<i>|</i>Instructor</div>
    </div>
  </div>
  <div class="line"></div>
</body>
</html>
