<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[NIX] - Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23141820'/><rect x='4' y='4' width='92' height='92' rx='12' fill='none' stroke='%2300e5ff' stroke-width='3'/><text x='50' y='64' font-family='monospace' font-size='36' font-weight='bold' fill='%2300e5ff' text-anchor='middle'>NIX</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- LOADER -->
  <div id="loader">
    <div class="loader-text">[NIX] LOADING...</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
  </div>

  <!-- MODAL -->
  <div id="projectModal" class="modal">
    <div class="modal-content">
      <div class="modal-close" onclick="closeModal()">×</div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-sub" id="modalSub"></div>
      <p class="modal-desc" id="modalDesc"></p>

      <div class="modal-meta" id="modalMetaRow" style="display:none">
        <span id="modalRole"></span>
        <span id="modalDownloads"></span>
      </div>

      <div id="modalSkillSection" style="display:none">
        <div class="modal-video-label">// proficiency</div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px;">
          <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;">
            <div id="modalSkillBar" style="height:100%;background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:3px;width:0%;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);"></div>
          </div>
          <span id="modalSkillPct" style="font-family:var(--mono);font-size:0.78rem;color:var(--accent);min-width:36px;text-align:right;"></span>
        </div>
      </div>

      <div id="modalPkgSection" style="display:none;margin-bottom:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
          <div id="modalPkgTags" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
          <div style="display:flex;align-items:center;gap:14px;">
            <span id="modalPkgStars" style="font-family:var(--mono);font-size:0.72rem;color:#ffd54f;"></span>
            <span id="modalPkgVersion" style="font-family:var(--mono);font-size:0.62rem;color:var(--purple);background:var(--purple-dim);border:1px solid rgba(124,77,255,0.15);padding:3px 10px;border-radius:20px;"></span>
          </div>
        </div>
      </div>

      <div id="modalVideoSection" style="display:none">
        <div class="modal-video-label">// video demo</div>
        <div class="modal-video" id="modalVideoBox"></div>
      </div>

      <div class="modal-case" id="modalCaseSection" style="display:none">
        <div class="modal-case-title">// case study</div>
        <div id="modalCaseStudy"></div>
      </div>

      <a id="modalLink" class="modal-btn" target="_blank" style="display:none"></a>
    </div>
  </div>

  <!-- NAV -->
  <nav>
    <a class="nav-logo" href="#" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
      <img class="logo-img" id="logoImg" src="" alt="NIX" />
      <span id="logoName"><span class="bracket">[</span>NIX<span class="bracket">]</span></span>
    </a>

    <ul class="nav-links" id="navLinks">
      <li><a href="#about" data-i18n="nav_about">About</a></li>
      <li><a href="#projects" data-i18n="nav_projects">Projects</a></li>
      <li><a href="#skills" data-i18n="nav_skills">Skills</a></li>
      <li><a href="#contact" data-i18n="nav_contact">Contact</a></li>
    </ul>

    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn" id="btnEn" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btnVi" onclick="setLang('vi')">VI</button>
      </div>
      <button class="nav-hamburger" id="hamburger" onclick="toggleMobileNav()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main>

    <!-- HERO / ABOUT -->
    <section id="about">
      <div class="container">
        <div class="hero-grid">
          <div class="hero-left">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <h1 id="heroName"></h1>
            <p class="hero-title" id="heroTitle"></p>

            <div class="status-badge">
              <div class="status-dot-wrap"><div class="status-dot"></div></div>
              <div>
                <div class="status-text" id="statusText"></div>
                <div class="status-label-sub" id="statusSub"></div>
              </div>
            </div>

            <div class="stats-row" id="statsRow"></div>
            <div class="contact-links" id="contactLinks"></div>
          </div>

          <div class="avatar-card">
            <div class="avatar-box" id="avatarBox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-marker">›</span>
          <span class="section-label" data-i18n="section_projects">PROJECTS</span>
        </div>

        <div class="project-tabs reveal reveal-d1">
          <button class="tab-btn active" id="tabGames" onclick="switchTab('games')" data-i18n="tab_games">Games</button>
          <button class="tab-btn" id="tabPackages" onclick="switchTab('packages')" data-i18n="tab_packages">Packages</button>
        </div>

        <div class="tab-panel active" id="panelGames">
          <div class="games-grid" id="gamesGrid"></div>
        </div>

        <div class="tab-panel" id="panelPackages">
          <div class="packages-header">
            <div class="packages-subtitle" data-i18n="package_list_sub">Tools and libraries I've built for the Unity community.</div>
          </div>
          <div class="packages-list" id="packagesList"></div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section id="skills">
      <div class="container">
        <div class="section-header reveal">
          <span class="section-marker">›</span>
          <span class="section-label" data-i18n="section_skills">SKILLS</span>
        </div>
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact">
      <div class="container">
        <div class="contact-box reveal">
          <div class="contact-title" data-i18n="contact_title">Get In Touch</div>
          <div class="contact-sub" data-i18n="contact_sub">Open to new opportunities and collaborations.</div>
          <a href="#" class="btn-email" id="emailBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
            <span data-i18n="send_email">Send Email</span>
          </a>
        </div>
      </div>
    </section>

  </main>

  <footer>
    <span id="footerText">© 2025 — Built with ☕</span>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
