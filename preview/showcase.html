<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Showcase Section — Preview</title>
<link rel="icon" type="image/png" href="../assets/logo/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/style.css" />
<style>
/* ── preview-only ── */
.pv-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;font-family:var(--mono);font-size:.66rem;color:var(--gold);background:rgba(14,19,29,.95);border:1px dashed rgba(255,213,79,.45);padding:7px 14px;border-radius:10px;max-width:calc(100% - 32px);text-align:center}
.pv-stub{border:1px dashed var(--line2);border-radius:20px;padding:40px 24px;text-align:center;font-family:var(--mono);font-size:.75rem;color:var(--dim)}

/* ── SHOWCASE ── */
#showcase{position:relative}
.sc-group+.sc-group{margin-top:96px}
.sc-gh{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.sc-gh::before,.sc-gh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}
.sc-gh::after{transform:scaleX(-1)}
.sc-gh h3{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;color:var(--bright);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.sc-gh h3 i{font-style:normal;font-family:var(--mono);font-size:.62rem;font-weight:500;color:var(--pink);letter-spacing:.18em;margin-right:12px;vertical-align:middle}

/* Tools: one big block per tool */
.sc-tool{max-width:1000px;margin:0 auto 80px;display:grid;justify-items:center;gap:22px}
.sc-tool:last-child{margin-bottom:0}
.sc-tool>h3{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:900;color:var(--bright);letter-spacing:-.02em;text-transform:uppercase;text-align:center}
.sc-frame{position:relative;width:100%;padding:14px}
.sc-frame::before,.sc-frame::after{content:'';position:absolute;top:0;width:34px;height:34px;border-top:3px solid var(--ac);pointer-events:none}
.sc-frame::before{left:0;border-left:3px solid var(--ac)}
.sc-frame::after{right:0;border-right:3px solid var(--ac)}
.sc-frame .sc-media{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 0 50px -12px var(--ac),0 30px 80px rgba(0,0,0,.55)}
.sc-tool .sc-info{margin:0}

/* Other projects: grid */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.sc-gcard{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line2);color:inherit;text-decoration:none;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
a.sc-gcard:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 0 30px -8px var(--ac)}
.sc-gcard .sc-media{position:relative;aspect-ratio:16/9}
.sc-gcard .sc-ph{font-size:2.4rem}
.sc-gbody{padding:14px 16px 16px;display:grid;gap:6px}
.sc-gbody small{font-family:var(--mono);font-size:.6rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.sc-gbody h4{font-size:1.05rem;font-weight:800;color:var(--bright)}
.sc-gbody p{font-size:.84rem;color:var(--dim)}
.sc-gbody .chips{margin-top:4px}

/* full-bleed stage so side cards run to the screen edges */
.sc-stage{--cw:min(720px,74vw);--gap:.64;position:relative;width:100vw;margin-left:calc(50% - 50vw);height:calc(var(--cw) * 9 / 16 + 80px);
  perspective:1500px;overflow:hidden;touch-action:pan-y;user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.sc-glow{position:absolute;inset:10% 20%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.35;background:radial-gradient(closest-side,var(--ac,var(--cyan)),transparent);transition:background .6s}
.sc-track{position:absolute;inset:0;transform-style:preserve-3d}
.sc-card{position:absolute;left:50%;top:40px;width:var(--cw);aspect-ratio:16/9;margin-left:calc(var(--cw) / -2);
  border-radius:16px;overflow:hidden;background:var(--card2);border:1px solid var(--line2);cursor:pointer;
  transform:translateX(calc(var(--d) * var(--cw) * var(--gap))) translateZ(calc(var(--ad) * -180px)) rotateY(calc(var(--s) * -34deg));
  opacity:calc(1 - var(--ad) * .22);z-index:calc(10 - var(--ad));
  transition:transform .7s var(--ease),opacity .5s,box-shadow .5s,border-color .5s}
.sc-card.far{opacity:0;pointer-events:none}
.sc-card::after{content:'';position:absolute;inset:0;background:rgba(7,9,15,.55);transition:opacity .5s;pointer-events:none}
.sc-card.on{cursor:default;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 40px -6px var(--ac),0 40px 90px rgba(0,0,0,.6)}
.sc-card.on::after{opacity:0}
.sc-ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:clamp(2rem,6vw,4rem);color:rgba(255,255,255,.88);
  background:radial-gradient(120% 90% at 20% 10%,var(--ac) 0%,transparent 60%),radial-gradient(100% 80% at 90% 100%,var(--purple),transparent 70%),var(--card2)}
.sc-kind{position:absolute;top:14px;left:14px;z-index:2;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:rgba(7,9,15,.75);border:1px solid var(--line2);color:var(--bright);backdrop-filter:blur(6px)}

.sc-nav{position:absolute;top:calc(40px + var(--cw) * 9 / 32);z-index:20;transform:translateY(-50%);width:48px;height:48px;display:grid;place-items:center;border-radius:50%;
  color:var(--bright);background:rgba(7,9,15,.6);border:1px solid var(--line2);backdrop-filter:blur(8px);transition:color .2s,border-color .2s,transform .25s var(--ease)}
.sc-nav:hover{color:var(--cyan);border-color:var(--cyan)}
.sc-nav:active{transform:translateY(-50%) scale(.92)}
.sc-prev{left:calc(50% - var(--cw) / 2 - 24px)}
.sc-next{right:calc(50% - var(--cw) / 2 - 24px)}
.sc-nav svg{width:20px;height:20px}

/* info under the active card */
.sc-info{max-width:680px;margin:6px auto 0;text-align:center;display:grid;justify-items:center;gap:12px}
.sc-info.swap{animation:scIn .5s var(--ease)}
@keyframes scIn{from{opacity:0;transform:translateY(12px)}}
.sc-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:var(--mono);font-size:.62rem;color:var(--dim)}
.prod{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);padding:4px 10px;border-radius:20px;border:1px solid rgba(105,255,71,.3);background:rgba(105,255,71,.06)}
.prod .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.sc-info h3{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:900;color:var(--bright);letter-spacing:-.025em;line-height:1.15}
.sc-tag{font-size:1rem;color:var(--text)}
.sc-focus{font-size:.86rem;color:var(--dim);max-width:560px}
.sc-focus b{color:var(--ac);font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-right:8px}
.proof{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 20px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(7,9,15,.45)}
.proof .imp{text-align:left}
.proof .imp b{display:block;font-size:1.5rem;font-weight:900;color:var(--bright);letter-spacing:-.03em;line-height:1}
.proof .imp span,.proof .used span{font-family:var(--mono);font-size:.58rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.proof .used{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-left:1px solid var(--line);padding-left:20px}
.proof .used em{font-style:normal;font-size:.74rem;color:var(--bright);padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.sc-info .chips{justify-content:center;margin-top:0}
.sc-act{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.sc-lock{font-family:var(--mono);font-size:.66rem;color:var(--dim);display:inline-flex;align-items:center;gap:6px}

.sc-dots{display:flex;justify-content:center;gap:8px;margin-top:28px}
.sc-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px}
.sc-row .chips,.sc-row .sc-act{margin:0}

/* Prototype carousel: card + info fit in one screen */
#scProto .sc-gh{margin-bottom:8px}
#scProto .sc-stage{--cw:min(720px,74vw,calc((100svh - 380px) * 16 / 9));height:calc(var(--cw) * 9 / 16 + 48px)}
#scProto .sc-card{top:24px}
#scProto .sc-nav{top:calc(24px + var(--cw) * 9 / 32)}
#scProto .sc-info{gap:6px;margin-top:0}
#scProto .sc-info h3{font-size:clamp(1.3rem,2.4vw,1.6rem)}
#scProto .sc-tag{font-size:.92rem}
#scProto .sc-focus{font-size:.8rem}
#scProto .sc-row{margin-top:6px}
#scProto .sc-dots{margin-top:14px}
.sc-dots button{width:30px;height:4px;border-radius:2px;background:var(--line2);transition:background .3s,width .4s var(--ease)}
.sc-dots button.on{width:46px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

@media (max-width:760px){
  .sc-stage{--cw:82vw;--gap:.9;height:calc(var(--cw) * 9 / 16 + 56px)}
  .sc-card,#scProto .sc-card{top:28px}
  #scProto .sc-stage{--cw:82vw;height:calc(var(--cw) * 9 / 16 + 56px)}
  .sc-nav{display:none}
  .proof .used{border-left:0;padding-left:0;justify-content:center}
  .links{display:none}
}
@media (prefers-reduced-motion:reduce){.sc-card,.sc-info.swap{transition:none;animation:none}}
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>

<nav class="scrolled">

<div class="pv-bar" data-k="pv"></div>

<script>

var UI = {

  used: { en: 'Used in', vi: 'Đã áp dụng' },
  focus: { en: 'Shows', vi: 'Thể hiện' },

  internal: { en: 'Internal tool · not public', vi: 'Tool nội bộ · không public' },
  sample: { en: 'sample data', vi: 'dữ liệu mẫu' },
  pv: { en: 'PREVIEW · ← → keys, swipe or click a side card · items marked "sample data" are placeholders', vi: 'PREVIEW · phím ← →, vuốt hoặc bấm card bên cạnh · mục có nhãn "dữ liệu mẫu" là nội dung giả' }
};

/* Each item = one Database/Showcase/<id>/data.json in the real build (media = cover/video instead of glyph) */
var ITEMS = [
  {
    id: 'nix-uibuilder', kind: 'tool', year: 2026, accentColor: '#00e5ff', glyph: 'UI', placeholder: true,
    title: 'NIX UIBuilder',

var cur = 0, list = [];

function $(id) { return document.getElementById(id); }
function t(k) { return (UI[k] || {})[lang] || k; }
function loc(o) { return o == null ? '' : typeof o === 'string' ? o : o[lang] || o.en || ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sample(on) { return on ? ' <span class="sample">' + t('sample') + '</span>' : ''; }
var LOCK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

function actions(it) {
  var l = it.links || {}, h = '';
  if (l.play) h += '<a class="btn btn-pri btn-sm" href="' + esc(l.play) + '" target="_blank" rel="noopener">' + t('play') + ' →</a>';
  if (l.source) h += '<a class="btn btn-ghost" href="' + esc(l.source) + '" target="_blank" rel="noopener">' + t('source') + '</a>';
  if (l.post) h += '<a class="btn btn-ghost" href="' + esc(l.post) + '" target="_blank" rel="noopener">' + t('post') + '</a>';
  if (!h && it.access === 'internal') h = '<span class="sc-lock">' + LOCK + t('internal') + '</span>';
  return h ? '<div class="sc-act">' + h + '</div>' : '';
}

function info(it, noTitle) {
  var proof = '';
  if (it.kind === 'tool' && (it.impact || (it.usedIn || []).length)) {
    proof = '<div class="proof">' +
      (it.impact ? '<div class="imp"><b>' + esc(it.impact.value) + '</b><span>' + esc(loc(it.impact.label)) + '</span></div>' : '') +
      ((it.usedIn || []).length ? '<div class="used"><span>' + t('used') + '</span>' + it.usedIn.map(function (u) { return '<em>' + esc(u) + '</em>'; }).join('') + '</div>' : '') +
      '</div>';
  }
  return '<div class="sc-badges">' + (it.kind === 'tool' ? '<span class="prod"><span class="dot"></span>' + t('prod') + '</span>' : '') +
      '<span>' + t('s_' + it.kind) + ' · ' + esc(it.year) + '</span></div>' +
    (noTitle ? '' : '<h3>' + esc(it.title) + sample(it.placeholder) + '</h3>') +
    '<p class="sc-tag">' + esc(loc(it.tagline)) + '</p>' +
    '<p class="sc-focus"><b>' + t('focus') + '</b>' + esc(loc(it.focus)) + '</p>' +
    proof +
    '<div class="sc-row"><div class="chips">' + (it.tech || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
    actions(it) + '</div>';
}

function ofKind(k) { return ITEMS.filter(function (it) { return it.kind === k; }); }
function ph(it) { return '<div class="sc-ph">' + esc(it.glyph) + '</div>'; }

/* Tools: title, big framed media, details underneath */
function buildTools() {
  $('scTools').innerHTML = ofKind('tool').map(function (it) {
    return '<article class="sc-tool" style="--ac:' + esc(it.accentColor) + '">' +
      '<h3>' + esc(it.title) + sample(it.placeholder) + '</h3>' +
      '<div class="sc-frame"><div class="sc-media">' + ph(it) + '</div></div>' +
      '<div class="sc-info">' + info(it, true) + '</div></article>';
  }).join('');
}

/* Other projects: grid cards, whole card links out when there is a link */
function buildOther() {
  $('scOther').innerHTML = ofKind('other').map(function (it) {
    var href = (it.links || {}).play, tag = href ? 'a' : 'div';
    return '<' + tag + ' class="sc-gcard" style="--ac:' + esc(it.accentColor) + '"' +
      (href ? ' href="' + esc(href) + '" target="_blank" rel="noopener"' : '') + '>' +
      '<div class="sc-media">' + ph(it) + '</div>' +
      '<div class="sc-gbody"><small>' + esc(it.year) + '</small>' +
      '<h4>' + esc(it.title) + sample(it.placeholder) + '</h4>' +
      '<p>' + esc(loc(it.tagline)) + '</p>' +
      '<div class="chips">' + (it.tech || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
      '</div></' + tag + '>';
  }).join('');
}

/* Prototype carousel: build cards once; moving only updates CSS vars */
function build() {
  buildTools(); buildOther();
  list = ofKind('prototype');
  cur = 0;
  $('scTrack').innerHTML = list.map(function (it, i) {
    return '<div class="sc-card" data-i="' + i + '" style="--ac:' + esc(it.accentColor) + '">' +
      '<span class="sc-kind">' + t('s_' + it.kind) + '</span><div class="sc-ph">' + esc(it.glyph) + '</div></div>';
  }).join('');
  $('scDots').innerHTML = list.map(function (it, i) { return '<button type="button" data-i="' + i + '" aria-label="' + esc(it.title) + '"></button>'; }).join('');
  var multi = list.length > 1;
  $('scPrev').hidden = $('scNext').hidden = $('scDots').hidden = !multi;
  go(0, true);
}

function go(i, silent) {
  var n = list.length; if (!n) return;
  cur = (i + n) % n;
  document.querySelectorAll('.sc-card').forEach(function (c, k) {
    var d = k - cur;
    if (d > n / 2) d -= n; if (d < -n / 2) d += n;   // wrap so neighbours sit on both sides
    var ad = Math.abs(d);
    c.style.setProperty('--d', d); c.style.setProperty('--ad', ad); c.style.setProperty('--s', Math.sign(d));
    c.classList.toggle('on', d === 0); c.classList.toggle('far', ad > 2);
  });
  document.querySelectorAll('#scDots button').forEach(function (b, k) { b.classList.toggle('on', k === cur); });
  var it = list[cur], el = $('scInfo');
  el.style.setProperty('--ac', it.accentColor);
  $('scGlow').style.setProperty('--ac', it.accentColor);
  el.innerHTML = info(it);
  if (!silent) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
  restart();
}

function renderStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(function (el) { el.textContent = t(el.dataset.k); });
}

/* autoplay: next card every 5s; pauses while hovered/focused or the tab is hidden; manual moves restart the timer */
var AUTO_MS = 5000, timer = null, paused = false;
function restart() { clearInterval(timer); timer = setInterval(function () { if (!paused && !document.hidden && list.length > 1) go(cur + 1); }, AUTO_MS); }
['mouseenter', 'focusin'].forEach(function (ev) { $('scProto').addEventListener(ev, function () { paused = true; }); });
['mouseleave', 'focusout'].forEach(function (ev) { $('scProto').addEventListener(ev, function () { paused = false; }); });

$('scPrev').addEventListener('click', function () { go(cur - 1); });
$('scNext').addEventListener('click', function () { go(cur + 1); });
$('scDots').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) go(+b.dataset.i); });

/* swipe / drag; a tap on a side card brings it to the centre */
var sx = null, moved = false;
$('scStage').addEventListener('pointerdown', function (e) { if (e.target.closest('.sc-nav')) return; sx = e.clientX; moved = false; });
window.addEventListener('pointerup', function (e) {
  if (sx == null) return;
  var dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 40) { moved = true; go(cur + (dx < 0 ? 1 : -1)); }
});
$('scTrack').addEventListener('click', function (e) {
  var c = e.target.closest('.sc-card'); if (!c || moved) return;
  if (+c.dataset.i !== cur) go(+c.dataset.i);
});
document.addEventListener('keydown', function (e) {
  if (e.target.closest('input,textarea')) return;
  var r = $('scStage').getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return;   // only when the section is on screen
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});

$('lang').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.l;
  this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
  var keep = cur; renderStatic(); build(); go(keep, true);
});

renderStatic(); build();
</script>
</body>
</html>
